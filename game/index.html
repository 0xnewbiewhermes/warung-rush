<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Warung Rush — a night-market cooking game</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07110f; overflow: hidden; }
  body { display: grid; place-items: center; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #stage { position: relative; width: min(100vw, calc(100vh * 2.6667)); aspect-ratio: 1280 / 480; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: auto; border-radius: 6px; }
  #hint { position: absolute; inset: auto 0 -1.45rem 0; text-align: center; color: #6f8478; font-size: 12px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="480" aria-label="Warung Rush, a night-market cooking game"></canvas>
    <div id="hint">WASD / arrows to walk · E or click to use a station · hold E to cook · 1-4 pick a ticket</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
